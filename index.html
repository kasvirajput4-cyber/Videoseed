<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator | Vibe</title>
    <style>
        :root {
            --bg-dark: #070907;
            --neon-glow: rgba(153, 255, 51, 0.15);
            --accent-green: #99ff33;
            --text-main: #ffffff;
            --text-muted: #889988;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at 50% 40%, var(--neon-glow) 0%, transparent 60%);
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background-color: var(--accent-green);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #070907;
            font-size: 14px;
            font-weight: 900;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 20px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .auth-buttons button {
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .auth-buttons button:hover {
            opacity: 0.8;
        }

        .auth-buttons .signup-btn {
            background-color: var(--accent-green);
            color: #070907;
            border-radius: 30px;
            font-weight: 600;
            margin-left: 10px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px 60px;
            max-width: 800px;
            width: 100%;
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -1px;
            line-height: 1.1;
            background: linear-gradient(to bottom, #ffffff 70%, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 60px;
            line-height: 1.5;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Generator Input Section */
        .input-group {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 10px 10px 10px 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--accent-green);
        }

        .input-group input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 12px 16px;
            font-size: 16px;
            outline: none;
        }

        .input-group input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .settings-select {
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 20px;
            margin: 0 6px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23889988' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
            padding-right: 32px;
        }

        .settings-select:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .generate-btn {
            background-color: var(--accent-green);
            color: #070907;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            transition: transform 0.2s;
        }

        .generate-btn:hover {
            transform: scale(1.05);
        }

        /* Mode Selectors */
        .mode-selectors {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 80px;
        }

        .mode-option {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .mode-option:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .mode-option.active {
            background: rgba(153, 255, 51, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Result Area */
        .preview-gallery {
            display: flex;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
        }

        .preview-box {
            flex: 1;
            aspect-ratio: 16 / 9;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .preview-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid var(--glass-border);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
            display: none; /* Show this when generating */
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <div class="logo-icon">V</div> Vibe
        </div>
        <div class="nav-links">
            <a href="#">Showcase</a>
            <a href="#">Models</a>
            <a href="#">Pricing</a>
            <a href="#">API</a>
        </div>
        <div class="auth-buttons">
            <button>Log in</button>
            <button class="signup-btn">Sign up</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Create Videos from Text</h1>
        <p>Turn your imagination into cinematic videos using the most advanced AI video generation models.</p>

        <div class="input-container">
            <div class="input-group">
                <input type="text" id="promptInput" placeholder="Describe the video you want to generate...">
                
                <select id="ratioSelect" class="settings-select">
                    <option value="16:9">16:9 Cinematic</option>
                    <option value="9:16">9:16 Vertical</option>
                    <option value="1:1">1:1 Square</option>
                </select>
                
                <select id="durationSelect" class="settings-select">
                    <option value="5">5s</option>
                    <option value="11">11s</option>
                </select>

                <button class="generate-btn" onclick="startGeneration()">→</button>
            </div>
        </div>
    </div>

    <div class="mode-selectors">
        <div class="mode-option active">
            🎥 Video Generator (Seedance 2.5)
        </div>
        <div class="mode-option">
            🪄 AI Editor
        </div>
    </div>

    <div class="preview-gallery">
        <div class="preview-box">
            <div class="loading-spinner"></div>
            <span id="placeholderText">Your generated video will appear here</span>
        </div>
    </div>

    <script>
        function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            const ratio = document.getElementById('ratioSelect').value;
            const duration = document.getElementById('durationSelect').value;
            
            if (!prompt) {
                alert('Please enter a description for your video.');
                return;
            }

            // Simple UI state change during 'generation'
            const spinner = document.querySelector('.loading-spinner');
            const placeholder = document.getElementById('placeholderText');
            
            spinner.style.display = 'block';
            placeholder.textContent = 'Generating your video...';

            console.log(`Generating: "${prompt}", Ratio: ${ratio}, Duration: ${duration}s`);

            // Simulate API delay
            setTimeout(() => {
                spinner.style.display = 'none';
                placeholder.textContent = 'Generation complete (Simulation)';
                alert('Generation complete!');
            }, 3000);
        }
    </script>
</body>
          </html>
