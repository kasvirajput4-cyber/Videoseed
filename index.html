<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator | Vibe</title>
    <style>
        :root {
            --bg-dark: #070907;
            --neon-glow: rgba(153, 255, 51, 0.15);
            --accent-green: #99ff33;
            --text-main: #ffffff;
            --text-muted: #889988;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at 50% 40%, var(--neon-glow) 0%, transparent 60%);
            overflow-x: hidden;
        }

        nav {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background-color: var(--accent-green);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #070907;
            font-size: 14px;
            font-weight: 900;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 30px;
            max-width: 800px;
            width: 100%;
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.1;
            background: linear-gradient(to bottom, #ffffff 70%, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .config-bar {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        .api-input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            font-size: 13px;
            outline: none;
            text-align: center;
        }

        .api-input:focus {
            border-color: var(--accent-green);
        }

        .input-group {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 10px 8px 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        .input-group:focus-within {
            border-color: var(--accent-green);
        }

        .input-group input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px;
            font-size: 15px;
            outline: none;
        }

        .settings-select {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 18px;
            margin: 0 4px;
            outline: none;
            font-size: 13px;
            cursor: pointer;
        }

        .generate-btn {
            background-color: var(--accent-green);
            color: #070907;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            transition: transform 0.2s;
        }

        .generate-btn:hover {
            transform: scale(1.05);
        }

        .preview-gallery {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            padding: 0 20px 40px;
        }

        .preview-box {
            width: 100%;
            min-height: 360px;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 2px solid var(--glass-border);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <div class="logo-icon">V</div> Vibe
        </div>
    </nav>

    <div class="hero">
        <h1>Create Videos from Text</h1>
        <p>Seedance 2.5 Powered AI Video Generator</p>

        <div class="config-bar">
            <input type="password" id="apiKeyInput" class="api-input" placeholder="Paste your BytePlus API Key here (Bearer token)">
        </div>

        <div class="input-container">
            <div class="input-group">
                <input type="text" id="promptInput" placeholder="Describe the video you want to generate...">
                
                <select id="ratioSelect" class="settings-select">
                    <option value="16:9">16:9 Cinematic</option>
                    <option value="9:16">9:16 Vertical</option>
                    <option value="1:1">1:1 Square</option>
                </select>
                
                <select id="durationSelect" class="settings-select">
                    <option value="5">5s</option>
                    <option value="11" selected>11s</option>
                    <option value="30">30s</option>
                </select>

                <button class="generate-btn" id="genBtn" onclick="startGeneration()">→</button>
            </div>
        </div>
    </div>

    <div class="preview-gallery">
        <div class="preview-box" id="previewArea">
            <div class="loading-spinner" id="spinner"></div>
            <span id="statusText">Your generated video will appear here</span>
        </div>
    </div>

    <script>
        async function startGeneration() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const ratio = document.getElementById('ratioSelect').value;
            const duration = parseInt(document.getElementById('durationSelect').value, 10);
            
            const spinner = document.getElementById('spinner');
            const statusText = document.getElementById('statusText');
            const previewArea = document.getElementById('previewArea');

            if (!apiKey) {
                alert('कृपया अपनी BytePlus API Key डालें।');
                return;
            }

            if (!prompt) {
                alert('कृपया वीडियो का प्रॉम्प्ट लिखें।');
                return;
            }

            spinner.style.display = 'block';
            statusText.textContent = 'Task submit ho raha hai...';

            try {
                // Task Submit Request
                const response = await fetch('https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "dreamina-seedance-2-5-260628",
                        content: [
                            {
                                type: "text",
                                text: prompt
                            }
                        ],
                        generate_audio: true,
                        ratio: ratio,
                        duration: duration,
                        watermark: false
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'API Request failed');
                }

                const taskId = data.id || (data.data && data.data.id);
                if (!taskId) {
                    throw new Error('Task ID prapt nahi hui.');
                }

                statusText.textContent = `Video generate ho rahi hai (Task ID: ${taskId}). Kripya intezar karein...`;
                
                // Status Poll loop
                pollTaskStatus(taskId, apiKey);

            } catch (error) {
                spinner.style.display = 'none';
                statusText.textContent = 'Error: ' + error.message;
                alert('Error: ' + error.message);
            }
        }

        async function pollTaskStatus(taskId, apiKey) {
            const spinner = document.getElementById('spinner');
            const statusText = document.getElementById('statusText');
            const previewArea = document.getElementById('previewArea');

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks/${taskId}`, {
                        headers: {
                            'Authorization': `Bearer ${apiKey}`
                        }
                    });

                    const resultData = await res.json();
                    const status = resultData.status || (resultData.data && resultData.data.status);

                    if (status === 'succeeded' || status === 'SUCCESS') {
                        clearInterval(interval);
                        spinner.style.display = 'none';
                        statusText.style.display = 'none';

                        const videoUrl = resultData.content?.[0]?.video_url?.url || 
                                         resultData.data?.content?.[0]?.video_url?.url;

                        if (videoUrl) {
                            previewArea.innerHTML = `<video src="${videoUrl}" controls autoplay loop></video>`;
                        } else {
                            statusText.style.display = 'block';
                            statusText.textContent = 'Video ready hai par link display nahi ho saka.';
                        }
                    } else if (status === 'failed' || status === 'FAILED') {
                        clearInterval(interval);
                        spinner.style.display = 'none';
                        statusText.textContent = 'Video generation fail ho gaya.';
                    } else {
                        statusText.textContent = `Progress me hai (${status})...`;
                    }
                } catch (e) {
                    clearInterval(interval);
                    spinner.style.display = 'none';
                    statusText.textContent = 'Status check karne me error aaya: ' + e.message;
                }
            }, 5000);
        }
    </script>
</body>
</html>
